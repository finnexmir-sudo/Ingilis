<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b111b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="İngilis">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="shortcut icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>İngilis Dili</title>
<style>
:root{
  --ink:#0b111b; --ink-2:#131c29; --ink-3:#1d2836; --line:#28354a;
  --paper:#f7f4ec; --paper-2:#e9e4d6;
  --on-paper:#16202b; --on-paper-soft:#5b6474;
  --fg:#e6ebf3; --fg-soft:#828fa4;
  --teal:#31b0c0; --teal-deep:#0d6f7c; --teal-glow:rgba(49,176,192,.16);
  --amber:#dd9130; --moss:#4fb86e; --rose:#e8556a; --violet:#9b7bff;
  --r:16px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --serif:Georgia,"Noto Serif","Times New Roman",serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  height:100%;margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);
  display:flex;flex-direction:column;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}

/* ---------- ust panel ---------- */
#bar{display:flex;align-items:center;gap:10px;flex:0 0 auto;
  padding:calc(env(safe-area-inset-top) + 11px) 14px 11px;
  background:var(--ink-2);border-bottom:1px solid var(--line)}
#back{font-size:15px;color:var(--fg-soft);padding:7px 9px;border-radius:9px;display:none}
#back:active{background:var(--ink-3)}
#bar h1{font-size:14px;font-weight:600;margin:0;letter-spacing:.02em;color:var(--fg-soft)}
#count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--fg-soft)}
#prog{flex:0 0 auto;height:3px;background:var(--ink-3)}
#prog>i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s ease}

/* ---------- govde ---------- */
#main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 26px;
  position:relative}
.wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.wrap.top{justify-content:flex-start}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.anim{animation:slideIn .22s ease both}

/* ---------- alt panel ---------- */
#foot{flex:0 0 auto;padding:12px 16px calc(env(safe-area-inset-bottom) + 13px);
  background:var(--ink-2);border-top:1px solid var(--line);display:none}
#tabs{flex:0 0 auto;display:flex;background:var(--ink-2);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;
  gap:3px;color:var(--fg-soft);font-size:10px;letter-spacing:.01em}
#tabs button s{font-size:20px;line-height:1;text-decoration:none;filter:grayscale(1) opacity(.6)}
#tabs button.on{color:var(--teal)}
#tabs button.on s{filter:none}
#tabs button:active{background:var(--ink-3)}

/* ---------- kagiz kart ---------- */
.card{background:var(--paper);color:var(--on-paper);border-radius:var(--r);
  padding:30px 22px;text-align:center;
  box-shadow:0 1px 0 var(--paper-2) inset,0 12px 34px rgba(0,0,0,.45)}
.hw{font-family:var(--serif);font-size:38px;font-weight:700;line-height:1.15;
  letter-spacing:-.01em;word-break:break-word}
.hw.sm{font-size:26px}
.tel{font-family:var(--mono);font-size:16px;color:var(--teal-deep);margin-top:8px}
.tel::before{content:"[ "}.tel::after{content:" ]"}
.pos{font-size:11px;color:var(--on-paper-soft);margin-top:9px;letter-spacing:.14em;text-transform:uppercase}
.rule{height:1px;background:var(--paper-2);margin:18px -22px}
.az{font-size:22px;font-weight:600;color:var(--amber);line-height:1.35;word-break:break-word}
.ex{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--on-paper-soft);
  margin-top:14px;line-height:1.5}
.spk{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;
  border-radius:50%;margin-top:15px;background:var(--paper-2);color:var(--teal-deep);font-size:18px}
.spk:active{transform:scale(.9)}

/* ---------- duymeler ---------- */
.btn{display:block;width:100%;padding:16px;border-radius:13px;background:var(--ink-3);
  color:var(--fg);font-size:16px;font-weight:600;text-align:center;border:1px solid var(--line)}
.btn:active{transform:scale(.985);background:var(--line)}
.btn.go{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:12px;font-size:13px;font-weight:500;color:var(--fg-soft)}
.row{display:flex;gap:9px}
.row>*{flex:1}
.menu{display:grid;gap:9px}
.menu .btn{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.menu .btn u{text-decoration:none;display:flex;align-items:center;gap:11px}
.menu .btn s{text-decoration:none;font-size:19px}
.menu .btn i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--fg-soft)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;border-radius:12px;
  background:var(--ink-2);border:1px solid var(--line);color:var(--fg);font-size:16px;
  margin-bottom:9px;line-height:1.35}
.opt b{font-family:var(--mono);font-size:12px;color:var(--fg-soft);flex:0 0 auto}
.opt span{flex:1;text-align:left}
.opt:active{background:var(--ink-3)}
.opt.ok{border-color:var(--moss);background:rgba(79,184,110,.15)}
.opt.no{border-color:var(--rose);background:rgba(232,85,106,.15)}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grades .btn{padding:15px 8px;font-size:15px}
.g0{color:var(--rose)}.g3{color:var(--amber)}.g4{color:var(--teal)}.g5{color:var(--moss)}
input[type=text]{width:100%;padding:16px;border-radius:12px;background:var(--ink-2);
  border:1px solid var(--line);color:var(--fg);font-size:19px;text-align:center;
  font-family:var(--serif);outline:none}
input[type=text]:focus{border-color:var(--teal)}

/* ---------- bu gun: halqa ---------- */
.ring{position:relative;width:190px;height:190px;margin:4px auto 6px}
.ring svg{transform:rotate(-90deg)}
.ring .bg{stroke:var(--ink-3)}
.ring .fg{stroke:var(--teal);stroke-linecap:round;transition:stroke-dashoffset .7s ease}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px}
.ring .in b{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:-.02em}
.ring .in s{text-decoration:none;font-size:11px;color:var(--fg-soft);letter-spacing:.12em;
  text-transform:uppercase}
.ring.done .fg{stroke:var(--moss)}
.ring.done .in b{color:var(--moss)}
.lvbar{display:flex;align-items:center;gap:10px;margin:14px 0 0}
.lvbar span{font-family:var(--mono);font-size:11px;color:var(--fg-soft);flex:0 0 auto}
.lvbar div{flex:1;height:6px;background:var(--ink-3);border-radius:3px;overflow:hidden}
.lvbar div i{display:block;height:100%;background:var(--violet);border-radius:3px;transition:width .5s}
.streak{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px;
  font-size:14px;color:var(--fg-soft)}
.streak b{font-family:var(--mono);font-size:19px;color:var(--amber)}

/* ---------- kicik plitkeler ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{background:var(--ink-2);border:1px solid var(--line);border-radius:13px;padding:13px 5px;
  text-align:center}
.tile b{display:block;font-family:var(--mono);font-size:20px;font-weight:700}
.tile s{display:block;font-size:10px;color:var(--fg-soft);text-decoration:none;margin-top:3px}

/* ---------- bolme basligi ---------- */
.sect{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-soft);
  margin:24px 0 11px}
.sect:first-child{margin-top:4px}

/* ---------- dialoq ---------- */
.dl{display:flex;flex-direction:column;gap:9px}
.line{max-width:88%;padding:12px 14px;border-radius:15px;line-height:1.4}
.line.a{align-self:flex-start;background:var(--ink-2);border:1px solid var(--line);
  border-bottom-left-radius:5px}
.line.b{align-self:flex-end;background:var(--teal-glow);border:1px solid var(--teal-deep);
  border-bottom-right-radius:5px}
.line b{display:block;font-family:var(--serif);font-size:16px;font-weight:600}
.line i{display:block;font-style:normal;font-size:13px;color:var(--fg-soft);margin-top:4px}
.line.hi{box-shadow:0 0 0 2px var(--teal)}
.line.mute i{display:none}
.who{font-family:var(--mono);font-size:9px;color:var(--fg-soft);letter-spacing:.1em;
  margin-bottom:3px;text-transform:uppercase}

/* ---------- kolge / audio ---------- */
.sh{background:var(--paper);color:var(--on-paper);border-radius:var(--r);padding:26px 20px;
  text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.sh b{display:block;font-family:var(--serif);font-size:23px;line-height:1.35;font-weight:700}
.sh i{display:block;font-style:normal;font-size:14px;color:var(--on-paper-soft);
  margin-top:12px;line-height:1.45}
.spd{display:flex;gap:7px;margin:14px 0 0}
.spd button{flex:1;padding:11px 4px;border-radius:10px;background:var(--ink-2);
  border:1px solid var(--line);color:var(--fg-soft);font-size:13px}
.spd button.on{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff;font-weight:600}
.play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;
  border-radius:13px;background:var(--teal-deep);color:#fff;font-size:17px;font-weight:700;margin-top:14px}
.play:active{transform:scale(.985)}
.play.pulse{animation:pulse 1.1s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--teal-glow)}50%{box-shadow:0 0 0 12px transparent}}
.reps{font-family:var(--mono);font-size:12px;color:var(--fg-soft);text-align:center;margin-top:11px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.dots i.on{background:var(--teal)}
.sh.long b{font-size:19px;line-height:1.5}
.tmr{font-family:var(--mono);font-size:52px;font-weight:700;text-align:center;color:var(--teal);
  letter-spacing:-.02em;margin:8px 0}
.tmr.run{color:var(--amber)}
.scaf{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  margin-bottom:7px}
.scaf b{display:block;font-family:var(--serif);font-size:16px;line-height:1.35}
.scaf i{display:block;font-style:normal;font-size:13px;color:var(--fg-soft);margin-top:3px}
.scaf button{float:right;color:var(--teal);font-size:15px;margin-left:8px}

/* ---------- bosluq doldurma ---------- */
.cloze{background:var(--paper);color:var(--on-paper);border-radius:var(--r);padding:28px 20px;
  text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.cloze b{font-family:var(--serif);font-size:21px;line-height:1.55;font-weight:400}
.gap{display:inline-block;min-width:76px;border-bottom:2.5px solid var(--teal-deep);
  color:var(--teal-deep);font-weight:700}
.cloze i{display:block;font-style:normal;font-size:13px;color:var(--on-paper-soft);margin-top:16px}
.cloze i::before{content:"ipucu · ";letter-spacing:.1em;text-transform:uppercase;font-size:10px}

/* ---------- qrammatika ---------- */
.lvl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--teal);
  border:1px solid var(--teal-deep);border-radius:5px;padding:2px 6px;flex:0 0 auto}
.les{display:flex;align-items:center;gap:11px;width:100%;padding:14px;border-radius:12px;
  background:var(--ink-2);border:1px solid var(--line);margin-bottom:8px;text-align:left}
.les:active{background:var(--ink-3)}
.les n{font-family:var(--mono);font-size:12px;color:var(--fg-soft);flex:0 0 22px;font-style:normal}
.les span{flex:1;font-size:15px;font-weight:600;line-height:1.3}
.les em{font-style:normal;font-size:11px;color:var(--fg-soft);font-family:var(--mono)}
.les.read{border-color:var(--teal-deep)}
.les.read n{color:var(--teal)}
.gh{font-family:var(--serif);font-size:19px;font-weight:700;margin:26px 0 10px;
  padding-bottom:7px;border-bottom:1px solid var(--line)}
.gh:first-child{margin-top:0}
.gp{font-size:15px;line-height:1.65;margin:0 0 13px}
.gf{font-family:var(--mono);font-size:13px;line-height:1.7;background:var(--ink-2);
  border-left:3px solid var(--teal);border-radius:0 9px 9px 0;padding:11px 14px;margin:0 0 9px;
  -webkit-user-select:text;user-select:text;overflow-x:auto;white-space:pre-wrap}
.ge{background:var(--paper);border-radius:11px;padding:12px 14px;margin:0 0 8px}
.ge b{display:block;font-family:var(--serif);font-size:16px;color:var(--on-paper);line-height:1.4}
.ge i{display:block;font-style:normal;font-size:14px;color:var(--on-paper-soft);margin-top:4px}
.ge button{float:right;color:var(--teal-deep);font-size:15px;margin:-2px 0 0 8px}
.gx{display:flex;flex-direction:column;gap:5px;background:var(--ink-2);border-radius:11px;
  padding:11px 13px;margin:0 0 8px;font-size:14px;line-height:1.4}
.gx u{text-decoration:none;color:var(--rose)}
.gx v{color:var(--moss)}
.gx u::before{content:"✗  ";font-family:var(--mono)}
.gx v::before{content:"✓  ";font-family:var(--mono)}
.gw{font-size:14px;line-height:1.6;background:rgba(221,145,48,.12);
  border:1px solid rgba(221,145,48,.35);border-radius:11px;padding:12px 14px;margin:0 0 12px}
.gw::before{content:"Diqqət";display:block;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--amber);margin-bottom:5px}
.qz{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px}
.qz p{margin:0 0 11px;font-size:15px;font-weight:600;line-height:1.4}
.qo{display:block;width:100%;padding:11px 13px;border-radius:9px;background:var(--ink-3);
  color:var(--fg);font-size:14px;text-align:left;margin-bottom:6px;line-height:1.35}
.qo.ok{background:rgba(79,184,110,.18);color:var(--moss)}
.qo.no{background:rgba(232,85,106,.18);color:var(--rose)}
.qz p.qw{font-size:13px;font-weight:400;color:var(--fg-soft);line-height:1.55;margin:9px 0 0}

/* ---------- profil ---------- */
.prow{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.prow s{text-decoration:none;font-family:var(--mono);font-size:12px;color:var(--fg-soft)}
.pbar{height:5px;background:var(--ink-3);border-radius:3px;overflow:hidden;margin-bottom:13px}
.pbar>i{display:block;height:100%;background:var(--teal)}
.hard{display:flex;gap:10px;font-size:14px;padding:9px 0;border-bottom:1px solid var(--ink-3)}
.hard u{text-decoration:none;font-family:var(--mono);color:var(--rose);font-size:12px}
.hard em{font-style:normal;color:var(--fg-soft)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-bottom:8px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--ink-3)}
.heat i.l1{background:rgba(49,176,192,.3)}
.heat i.l2{background:rgba(49,176,192,.58)}
.heat i.l3{background:var(--teal)}
.ach{display:flex;align-items:center;gap:12px;background:var(--ink-2);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:7px;opacity:.42}
.ach.got{opacity:1;border-color:var(--teal-deep)}
.ach s{text-decoration:none;font-size:24px;flex:0 0 auto;filter:grayscale(1)}
.ach.got s{filter:none}
.ach div{flex:1}
.ach b{display:block;font-size:14px;font-weight:600}
.ach i{display:block;font-style:normal;font-size:12px;color:var(--fg-soft);margin-top:2px}
textarea{width:100%;height:110px;background:var(--ink-2);color:var(--fg);border:1px solid var(--line);
  border-radius:11px;padding:10px;font-family:var(--mono);font-size:11px;
  -webkit-user-select:text;user-select:text}

/* ---------- netice ---------- */
.done{text-align:center;padding:24px 0}
.done .big{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--teal)}
.done h3{font-family:var(--serif);font-size:21px;margin:12px 0 6px}
.done p{color:var(--fg-soft);font-size:14px;margin:0;line-height:1.6}
.xp{display:inline-block;font-family:var(--mono);font-size:15px;color:var(--violet);
  background:rgba(155,123,255,.14);border:1px solid rgba(155,123,255,.4);
  border-radius:20px;padding:6px 16px;margin-top:16px}
.feed{text-align:center;font-size:15px;font-weight:600;margin:14px 0 10px}
.note{font-size:12.5px;color:var(--fg-soft);text-align:center;line-height:1.65;margin-top:16px}
.note.l{text-align:left}
.empty{text-align:center;color:var(--fg-soft);font-size:14px;padding:40px 20px;line-height:1.6}
.hit{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  margin-bottom:8px}
.hit b{font-family:var(--serif);font-size:17px}
.hit u{text-decoration:none;font-family:var(--mono);font-size:12px;color:var(--teal);margin-left:8px}
.hit p{margin:4px 0 0;color:var(--amber);font-size:14px}
.hit small{color:var(--fg-soft);font-size:11px}
.mtd{background:var(--ink-2);border-left:3px solid var(--teal);border-radius:0 12px 12px 0;
  padding:14px 16px;margin-bottom:11px}
.mtd b{display:block;font-family:var(--serif);font-size:17px;margin-bottom:7px}
.mtd p{margin:0 0 8px;font-size:14px;line-height:1.6}
.mtd p:last-child{margin:0}
.mtd em{font-style:normal;color:var(--amber)}
#off{display:none;background:var(--amber);color:#1a1206;text-align:center;
  font-size:12px;font-weight:600;padding:5px}
#off.on{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 62px);background:var(--ink-3);
  border:1px solid var(--teal-deep);color:var(--fg);padding:11px 20px;border-radius:24px;
  font-size:14px;z-index:99;animation:slideIn .25s ease both;box-shadow:0 8px 24px rgba(0,0,0,.5)}
@media(min-width:620px){
  #main{padding-left:calc(50% - 280px);padding-right:calc(50% - 280px)}
  #foot>div,#tabs{max-width:620px;margin:0 auto;width:100%}
  .hw{font-size:44px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bar"><button id="back">‹ Geri</button><h1 id="title"></h1><span id="count"></span></div>
<div id="off">İnternet yoxdur — yaddaşdan işləyir</div>
<div id="prog"><i id="progi"></i></div>
<div id="main"></div>
<div id="foot"><div id="footin"></div></div>
<div id="tabs"></div>
<script>
"use strict";
const RAW = `I|mən|pron|I am from Baku.|01_esas_sozler|ay
you|sən / siz|pron|You are right.|01_esas_sozler|yu
he|o (kişi)|pron|He works at a bank.|01_esas_sozler|hi
she|o (qadın)|pron|She is my sister.|01_esas_sozler|şi
it|o (əşya)|pron|It is very cold today.|01_esas_sozler|it
we|biz|pron|We live in Azerbaijan.|01_esas_sozler|vi
they|onlar|pron|They are my friends.|01_esas_sozler|dey
my|mənim|adj|This is my car.|01_esas_sozler|may

l me where is the server.","Tell me where the server is.","Tell me where does the server."],"a":1,"why":"Cümlə içində söz sırası normal qalır."},{"q":"'Kömək edə bilərsiniz?'","o":["Do you can help me?","Can you help me?","Can do you help me?"],"a":1,"why":"Modal fellə köməkçi fel lazım deyil."}]},{"t":"İnkar cümlələr","lv":"A1","s":[["p","İngiliscədə inkar üçün 'not' işlənir, amma haraya qoyulacağı zamandan asılıdır."],["f","to be:  am not · is not (isn't) · are not (aren't)"],["f","Present Simple:  do not (don't) · does not (doesn't) + fel"],["f","Past Simple:  did not (didn't) + fel"],["f","Modal:  cannot (can't) · must not (mustn't) · should not (shouldn't)"],["e","I do not have access. ~ Girişim yoxdur."],["e","He didn't reply. ~ O cavab vermədi."],["e","You mustn't share the password. ~ Şifrəni paylaşmaq olmaz."],["h","İkiqat inkar OLMAZ"],["p","Azərbaycan dilində 'heç nə bilmirəm' — iki inkar var. İngiliscədə yalnız bir inkar işlənir."],["x","I don't know nothing. ~ I don't know anything."],["x","He didn't saw it. ~ He didn't see it."],["w","'did' və ya 'does' varsa əsas fel HƏMİŞƏ sadə formada qalır."]],"q":[{"q":"Hansı düzdür?","o":["He didn't sent it.","He didn't send it.","He not sent it."],"a":1,"why":"'didn't' varsa fel sadə formada qalır."},{"q":"'Heç nə görmədim':","o":["I didn't see nothing.","I didn't see anything.","I don't saw anything."],"a":1,"why":"İngiliscədə ikiqat inkar işlənmir."},{"q":"'Girişim yoxdur':","o":["I not have access.","I don't have access.","I doesn't have access."],"a":1,"why":"'I' ilə 'don't' işlənir."}]},{"t":"There is / There are","lv":"A1","s":[["p","Nəyinsə mövcud olduğunu bildirmək üçün. Azərbaycan dilindəki 'var' sözünün qarşılığıdır."],["f","There is + tək isim      ·      There are + cəm isim"],["e","There is a problem with the server. ~ Serverdə problem var."],["e","There are three users online. ~ Üç istifadəçi onlayndır."],["h","İnkar və sual"],["f","There isn't any... · There aren't any..."],["f","Is there...? · Ar I knowing him."],"a":1,"why":"'know' Continuous-da işlənmir."}]},{"t":"Past Simple — düzgün fellər","lv":"A2","s":[["p","Keçmişdə bitmiş hərəkət üçün. Vaxtı dəqiq bilinən və ya bilinməsi vacib olan hallarda."],["f","fel + ed  (bütün şəxslər üçün eyni)"],["e","I finished the report yesterday. ~ Hesabatı dünən bitirdim."],["e","They installed the patch last night. ~ Yamağı dünən gecə qurdular."],["h","-ed yazılış qaydası"],["f","adi:  work → worked"],["f","sonda 'e' varsa yalnız -d:  use → used"],["f","samit + y:  apply → applied"],["f","qısa fel, son samit ikiləşir:  stop → stopped, plan → planned"],["h","İnkar və sual — did"],["f","İnkar:  did not (didn't) + sadə fel"],["f","Sual:  Did + mübtəda + sadə fel?"],["e","Did you send the file? ~ Faylı göndərdiniz?"],["e","I didn't receive it. ~ Almadım."],["h","Zaman sözləri"],["f","yesterday · last week · two days ago · in 2020 · then"],["x","I didn't finished it. ~ I didn't finish it."],["x","Did he sent it? ~ Did he send it?"],["w","'did' varsa əsas feldə -ed OLMUR. Keçmişlik artıq 'did' sözündədir."]],"q":[{"q":"Hansı düzdür?","o":["Did you sent it?","Did you send it?","Did you sending it?"],"a":1,"why":"'did' varsa fel sadə formada qalır."},{"q":"'stop' felinin keçmiş forması:","o":["stoped","stopped","stopt"],"a":1,"why":"Qısa feldə son samit ikiləşir."},{"q":"'Dünən qurdum':","o":["I install it yesterday.","I installed it yesterday.","I have installed it yesterday."],"a":1,"why":"'yesterday' dəqiq keçmiş vaxtdır, Past Simple lazımdır."}]},{"t":"Past Simple — nizamsız fellər","lv":"A2","s":[["p","Ən çox işlənən fellərin əksəriyyəti nizamsızdır. Onları əzbərləmək lazımdır — qayda yoxdur."],["h","Ən vacib 20-si"],["f","be → was/were   ·   have → had   ·   do → did"],["f","go → went   ·   come → came   ·   see → saw"],["f","get → got   ·   give → gave   ·   take → took"],["f","make → made   ·   say → said   ·   tell → told"],["f","know → knew   ·   think → thought   ·   find → found"],["f","send → sent   ·   write → wrote   ·   read → read"],["f","run → ran   ·   put → put   ·   break → broke"],["e","I sent the file, but he didn't read it. ~ Faylı göndərdim, amma o oxumadı."],["h","Diqqət"],["p","'read' yazılışı dəyişmir, amma tələffüz dəyişir: rid (indiki) → red (keçmiş)."],["p","was — I, he, she, it ilə. were — you, we, they ilə."],["x","I goed to Baku. ~ I went to Baku."],["x","We was there. ~ We were there."],["w","Proqramda 'Nizamsız fellər' paketi var — orada 100 felin hər üç forması yazılıb."]],"q":[{"q":"'go' felinin keçmiş forması:","o":["goed","went","gone"],"a":1,"why":"'gone' üçüncü formadır, keçmiş zaman 'went'."},{"q":"We ___ at the office.","o":["was","were","been"],"a":1,"why":"'we' ilə 'were' işlənir."},{"q":"Hansı düzdür?","o":["He sended it.","He sent it.","He did sent it."],"a":1,"why":"'send' nizamsızdır: send → sent → sent."}]},{"t":"Gələcək — will və going to","lv":"A2","s":[["p","İngiliscədə gələcək üçün bir neçə forma var. Fərqi bilmək vacibdir."],["h","will — indi qərar verilən, proqnoz, vəd"],["f","will + sadə fel  (bütün şəxslər üçün eyni)"],["e","I will check it now. ~ İndi yoxlayacağam. (elə indi qərar verdim)"],["e","It will rain tomorrow. ~ Sabah yağış yağacaq. (proqnoz)"],["e","I will send it by Friday. ~ Cüməyə qədər göndərəcəyəm. (vəd)"],["h","going to — əvvəlcədən planlaşdırılmış"],["f","am / is / are + going to + sadə fel"],["e","We are going to migrate the server on Sunday. ~ Bazar günü serveri köçürəcəyik. (plan var)"],["e","Look at the disk — it is going to fill up. ~ Diskə bax, dolacaq. (əlamət var)"],["h","Present Continuous — razılaşdırılmış görüş"],["e","I am meeting the auditor at three. ~ Saat üçdə auditorla görüşürəm."],["x","I will to help you. ~ I will help you."],["x","When I will finish, I will call you. ~ When I finish, I will call you."],["w","Çox vacib: 'when', 'if', 'after', 'before', 'as soon as' sözlərindən sonra gələcək zaman İŞLƏNMİR — indiki zaman işlənir."]],"q":[{"q":"We ___ migrate the server on Sunday. (plan hazırdır)","o":["will","are going to","go to"],"a":1,"why":"Əvvəlcədən qurulmuş plan üçün 'going to'."},{"q":"Hansı düzdür?","o":["If it will fail, call me.","If it fails, call me.","If it failing, call me."],"a":1,"why":"'if' sonra gələcək zaman işlənmir."},{"q":"Telefon zəng çalır: 'I ___ answer it.'","o":["will","am going to","going to"],"a":0,"why":"Elə indi qəbul edilən qərar üçün 'will'."}]},{"t":"Müqayisə dərəcələri","lv":"A2","s":[["p","İki şeyi müqayisə etmək və ən üstünü bildirmək üçün. Qayda sözün uzunluğundan asılıdır."],["h","Qısa sifətlər (1 heca)"],["f","fast → faster → the fastest"],["f","big → bigger → the biggest  (son samit ikiləşir)"],["f","easy → easier → the easiest  (y düşür)"],["h","Uzun sifətlər (2+ heca)"],["f","expensive → more expensive → the most expensive"],["f","important → more important → the most important"],["h","Nizamsızlar"],["f","good → better → the best"],["f","bad → worse → the worst"],["f","far → further → the furthest"],["h","Cümlədə istifadə"],["e","This server is faster than the old one. ~ Bu server köhnəsindən sürətlidir."],["e","It is the most secure option. ~ Bu ən təhlükəsiz variantdır."],["e","SSD is not as slow as HDD. ~ SSD HDD qədər yavaş deyil."],["x","This is more faster. ~ This is faster."],["x","It is more better. ~ It is better."],["w","'more' və '-er' eyni vaxtda işlənmir. Biri kifayətdir."]],"q":[{"q":"This option is ___ than that one.","o":["more cheap","cheaper","most cheap"],"a":1,"why":"'cheap' qısa sifətdir, -er alır."},{"q":"Hansı düzdür?","o":["It is more better.","It is better.","It is the more good."],"a":1,"why":"'good' nizamsızdır: good → better → best."},{"q":"'ən vacib':","o":["the importantest","the most important","the more important"],"a":1,"why":"Uzun sifətlə 'the most' işlənir."}]},{"t":"Sayılan / sayılmayan — much, many, some, any","lv":"A2","s":[["p","İngiliscədə isimlər iki qrupa bölünür və bu, hansı sözlə işlənəcəyini müəyyən edir."],["f","Sayılan:  file, server, user, report  (cəm ola bilir)"],["f","Sayılmayan:  water, money, time, information, software, advice"],["h","Miqdar sözləri"],["f","many + sayılan cəm:  many users"],["f","much + sayılmayan:  much time"],["f","a lot of + hər ikisi:  a lot of users / a lot of time"],["f","a few + sayılan:  a few minutes"],["f","a little + sayılmayan:  a little water"],["h","some və any"],["f","some — təsdiq cümlədə:  I have some questions."],["f","any — inkar və sualda:  Do you have any questions?"],["p","İstisna: təklif və xahişdə 'some' işlənir — 'Would you like some tea?'"],["e","We do not have much time, but there are a few options. ~ Çox vaxtımız yoxdur, amma bir neçə variant var."],["x","How much users? ~ How many users?"],["x","I need some informations. ~ I need some information."],["w","'many' sayıla bilənlə, 'much' sayılmayanla. Sualda çox vaxt 'how many / how much' işlənir."]],"q":[{"q":"How ___ users are online?","o":["much","many","a lot"],"a":1,"why":"'users' sayıla biləndir, 'many' işlənir."},{"q":"We do not have ___ time.","o":["many","much","few"],"a":1,"why":"'time' sayılmayandır, 'much' işlənir."},{"q":"Do you have ___ questions?","o":["some","any","much"],"a":1,"why":"Sual cümləsində 'any' işlənir."}]},{"t":"Modal fellər — must, should, have to","lv":"A2","s":[["p","Məcburiyyət, məsləhət və zərurət bildirir. Fərqləri incədir, amma vacibdir."],["h","must — güclü daxili məcburiyyət, qayda"],["e","You must change your password every 90 days. ~ Şifrəni hər 90 gündən bir dəyişməlisiniz."],["h","have to — xarici məcburiyyət, şərait"],["e","I have to work on Saturday. ~ Şənbə işləməli oluram."],["h","should — məsləhət, tövsiyə"],["e","You should enable two-factor authentication. ~ İkifaktorlu autentifikasiyanı aktiv etməlisiniz."],["h","İnkarda MƏNA TAM DƏYİŞİR"],["f","must not = qadağandır"],["f","do not have to = lazım deyil, məcbur deyilsən"],["e","You mustn't share the password. ~ Şifrəni paylaşmaq qadağandır."],["e","You don't have to come early. ~ Erkən gəlmək məcburi deyil."],["h","Keçmiş forma"],["f","must → had to      ·      should → should have + 3-cü forma"],["e","I had to restart it. ~ Yenidən başlatmalı oldum."],["x","I must to go. ~ I must go."],["x","He musts follow the rule. ~ He must follow the rule."],["w","'must not' və 'don't have to' arasındakı fərqi qarışdırmaq ciddi anlaşılmazlığa səbəb olur."]],"q":[{"q":"'Şifrəni paylaşmaq qadağandır':","o":["You don't have to share it.","You mustn't share it.","You shouldn't have shared it."],"a":1,"why":"Qadağa üçün 'must not' işlənir."},{"q":"Hansı düzdür?","o":["I must to go now.","I must go now.","I must going now."],"a":1,"why":"Modaldan sonra 'to' işlənmir."},{"q":"Məsləhət vermək üçün ən uyğunu:","o":["You must use a VPN.","You should use a VPN.","You have to use a VPN."],"a":1,"why":"'should' tövsiyə bildirir."}]},{"t":"Present Perfect — have done","lv":"B1","s":[["p","Azərbaycan dilində birbaşa qarşılığı yoxdur, ona görə ən çətin mövzudur. Keçmişi indiki ilə bağlayır."],["f","have / has + felin 3-cü forması"],["h","Üç əsas istifadə"],["p","1. Vaxtı deyilməyən keçmiş təcrübə:"],["e","I have worked with FortiGate. ~ FortiGate ilə işləmişəm."],["p","2. Keçmişdə başlayıb indi də davam edən:"],["e","I have worked here since 2015. ~ 2015-dən burada işləyirəm."],["p","3. Nəticəsi indi görünən:"],["e","I have sent the report. ~ Hesabatı göndərmişəm. (indi sizdədir)"],["h","for və since"],["f","for + müddət:  for two years, for ten minutes"],["f","since + başlanğıc nöqtəsi:  since 2015, since Monday"],["h","Zaman sözləri"],["f","already · yet · just · ever · never · so far · recently"],["e","Have you finished yet? ~ Hələ bitirməmisiniz?"],["e","I have just restarted it. ~ Elə indicə yenidən başlatdım."],["x","I have worked here since two years. ~ I have worked here for two years."],["x","I am working here since 2015. ~ I have worked here since 2015."],["w","Bu zamanla dəqiq keçmiş vaxt (yesterday, last week, in 2020) İŞLƏNMİR."]],"q":[{"q":"I have worked here ___ five years.","o":["since","for","from"],"a":1,"why":"Müddət bildirəndə 'for' işlənir."},{"q":"Hansı düzdür?","o":["I have sent it yesterday.","I sent it yesterday.","I have send it yesterday."],"a":1,"why":"'yesterday' ilə Present Perfect işlənmir."},{"q":"'Hələ bitirməmisiniz?'","o":["Did you finish yet?","Have you finished yet?","Are you finished yet?"],"a":1,"why":"'yet' Present Perfect ilə işlənir."}]},{"t":"Present Perfect vs Past Simple","lv":"B1","s":[["p","Bu fərq ingiliscədə ən çox səhv edilən yerdir. Sual sadədir: vaxt deyilir, yoxsa yox?"],["h","Past Simple — vaxt dəqiqdir və bitib"],["e","I sent the report yesterday. ~ Hesabatı dünən göndərdim."],["e","We migrated the server in 2024. ~ Serveri 2024-də köçürdük."],["h","Present Perfect — vaxt deyilmir, nəticə vacibdir"],["e","I have sent the report. ~ Hesabatı göndərmişəm."],["e","We have migrated three servers. ~ Üç server köçürmüşük."],["h","Praktik yoxlama"],["p","Cümlədə 'yesterday, last week, ago, in 2020, then' varsa — Past Simple."],["p","'already, yet, just, ever, never, since, for, so far' varsa — Present Perfect."],["h","Söhbətdə tipik axın"],["e","Have you been to London? ~ Londonda olmusunuz? (təcrübə)"],["e","Yes, I went there in 2019. ~ Bəli, 2019-da getmişəm. (indi vaxt deyilir)"],["x","When have you sent it? ~ When did you send it?"],["w","'When' sualı həmişə Past Simple ilə qurulur, çünki 'when' özü dəqiq vaxt soruşur."]],"q":[{"q":"___ you ever used Ansible?","o":["Did","Have","Are"],"a":1,"why":"'ever' təcrübə soruşur, Present Perfect lazımdır."},{"q":"I ___ the patch last night.","o":["have installed","installed","install"],"a":1,"why":"'last night' dəqiq keçmiş vaxtdır."},{"q":"Hansı düzdür?","o":["When have you arrived?","When did you arrive?","When you arrived?"],"a":1,"why":"'When' ilə Past Simple işlənir."}]},{"t":"Past Continuous — davam edirdi","lv":"B1","s":[["p","Keçmişdə müəyyən anda davam edən hərəkət. Çox vaxt Past Simple ilə birlikdə işlənir."],["f","was / were + fel-ing"],["e","I was working when the power went off. ~ İşıq gedəndə işləyirdim."],["e","They were testing the system all night. ~ Bütün gecə sistemi test edirdilər."],["h","İki hərəkətin birləşməsi"],["p","Uzun hərəkət — Past Continuous. Onu kəsən qısa hərəkət — Past Simple."],["f","while + Past Continuous      ·      when + Past Simple"],["e","While I was checking the logs, the server crashed. ~ Jurnalları yoxlayarkən server çökdü."],["h","Fon təsviri"],["e","It was raining and the network was unstable. ~ Yağış yağırdı və şəbəkə qeyri-sabit idi."],["x","I was knowing the answer. ~ I knew the answer."],["x","While I checked the logs, it crashed. ~ While I was checking the logs, it crashed."],["w","'while' ilə adətən Continuous, 'when' ilə adətən Simple işlənir."]],"q":[{"q":"I ___ when he called.","o":["worked","was working","have worked"],"a":1,"why":"Zəng gələndə davam edən hərəkət."},{"q":"___ I was testing, the disk failed.","o":["When","While","Since"],"a":1,"why":"Davam edən hərəkətlə 'while' işlənir."},{"q":"Hansı SƏHVDİR?","o":["I was reading.","I was understanding.","I was writing."],"a":1,"why":"'understand' Continuous formada işlənmir."}]},{"t":"Past Perfect — keçmişdən əvvəlki keçmiş","lv":"B1","s":[["p","Keçmişdə iki hadisə varsa və biri o birindən əvvəl olubsa, əvvəlki üçün Past Perfect işlənir."],["f","had + felin 3-cü forması  (bütün şəxslər üçün eyni)"],["e","The server had already crashed when I arrived. ~ Mən çatanda server artıq çökmüşdü."],["e","I realised that I had forgotten the password. ~ Şifrəni unutduğumu anladım."],["h","Sıralama"],["p","Əvvəl baş verən = had + 3-cü forma. Sonra baş verən = Past Simple."],["e","He left before I had finished. ~ Mən bitirməmiş o getdi."],["h","Tez-tez işlənən sözlər"],["f","already · just · never · before · after · by the time"],["e","By the time we noticed, the data had been deleted. ~ Biz görəndə məlumat artıq silinmişdi."],["x","When I arrived, the meeting already started. ~ When I arrived, the meeting had already started."],["w","Hadisələr sıra ilə baş veribsə Past Perfect lazım deyil — sadəcə Past Simple kifayətdir."]],"q":[{"q":"When I arrived, they ___ already left.","o":["have","had","were"],"a":1,"why":"Mən çatmamışdan əvvəl getmişdilər."},{"q":"Hansı düzdür?","o":["I had forgot the key.","I had forgotten the key.","I had forgetting the key."],"a":1,"why":"'had' ilə felin 3-cü forması işlənir."},{"q":"'Biz görəndə fayl artıq silinmişdi':","o":["...the file was already deleted.","...the file had already been deleted.","...the file has already deleted."],"a":1,"why":"Daha əvvəlki keçmiş + məchul növ."}]},{"t":"Gerund və Infinitive — -ing yoxsa to","lv":"B1","s":[["p","Bir felin ardınca başqa fel gələndə hansı forma seçilir? Bu, birinci feldən asılıdır və əzbərlənir."],["h","-ing tələb edən fellər"],["f","enjoy · finish · avoid · suggest · consider · practise"],["f","mind · keep · recommend · risk · involve"],["e","I finished writing the script. ~ Skripti yazıb bitirdim."],["e","We avoid using shared accounts. ~ Ümumi hesablardan istifadə etməkdən çəkinirik."],["h","to + fel tələb edənlər"],["f","want · need · decide · plan · hope · agree · offer"],["f","promise · refuse · manage · learn · seem"],["e","We decided to upgrade the firmware. ~ Proqram təminatını yeniləməyə qərar verdik."],["h","Sözönündən sonra HƏMİŞƏ -ing"],["e","Thank you for helping me. ~ Kömək etdiyiniz üçün təşəkkür."],["e","He is good at solving problems. ~ Problem həll etməkdə yaxşıdır."],["h","Məna dəyişənlər"],["e","I stopped smoking. ~ Siqareti tərgitdim."],["e","I stopped to smoke. ~ Siqaret çəkmək üçün dayandım."],["x","I suggest to use SSH. ~ I suggest using SSH."],["x","I am interested in to learn Linux. ~ I am interested in learning Linux."],["w","'to' sözönü olanda da -ing gəlir: 'look forward to hearing from you'."]],"q":[{"q":"We decided ___ the server.","o":["upgrading","to upgrade","upgrade"],"a":1,"why":"'decide' feldən sonra 'to + fel' gəlir."},{"q":"I suggest ___ a stronger password.","o":["to use","using","use"],"a":1,"why":"'suggest' feldən sonra -ing gəlir."},{"q":"Thank you for ___ me.","o":["help","to help","helping"],"a":2,"why":"Sözönündən sonra həmişə -ing."}]},{"t":"Şərt cümlələri — 0 və 1","lv":"B1","s":[["p","Şərt cümlələri 'if' ilə qurulur. Dörd tipi var, ilk ikisi real hallar üçündür."],["h","Tip 0 — həmişə doğru olan"],["f","If + Present Simple, Present Simple"],["e","If you delete the file, it goes to the bin. ~ Faylı silsəniz, səbətə düşür."],["e","If the CPU exceeds 90 percent, the alert fires. ~ Prosessor 90 faizi keçəndə xəbərdarlıq işə düşür."],["h","Tip 1 — real, mümkün gələcək"],["f","If + Present Simple, will + fel"],["e","If you send it today, I will review it tomorrow. ~ Bu gün göndərsəniz, sabah baxaram."],["e","If the test fails, we will roll back. ~ Test uğursuz olsa, geri qaytaracağıq."],["h","Ən vacib qayda"],["p","'if' hissəsində HEÇ VAXT 'will' işlənmir. Bu, 'when', 'as soon as', 'until', 'before', 'after' üçün də keçərlidir."],["x","If it will fail, we will roll back. ~ If it fails, we will roll back."],["x","When I will finish, I will call. ~ When I finish, I will call."],["h","unless = if not"],["e","Unless you confirm, we will cancel it. ~ Təsdiqləməsəniz, ləğv edəcəyik."]],"q":[{"q":"If the backup ___, we will restore it.","o":["will work","works","worked"],"a":1,"why":"'if' hissəsində gələcək zaman işlənmir."},{"q":"Hansı düzdür?","o":["When I will arrive, I will call.","When I arrive, I will call.","When I arrive, I call."],"a":1,"why":"'when' sonra indiki, əsas hissədə 'will'."},{"q":"'Təsdiqləməsəniz, ləğv edəcəyik':","o":["Unless you confirm, we will cancel.","If you confirm, we will cancel.","Unless you will confirm, we cancel."],"a":0,"why":"'unless' = 'if not'."}]},{"t":"Şərt cümlələri — 2 və 3","lv":"B1","s":[["p","Bu iki tip real olmayan, xəyali vəziyyətlər üçündür."],["h","Tip 2 — indiki qeyri-real"],["f","If + Past Simple, would + fel"],["e","If I had more budget, I would buy a new firewall. ~ Daha çox büdcəm olsaydı, yeni firewall ala  is old, failed.","Our server what is old failed."],"a":1,"why":"Vergüllü əlavə cümlədə 'that' işlənmir."},{"q":"Hansı variantda əvəzliyi buraxmaq OLAR?","o":["The man who called me.","The file that I sent.","The tool which crashed."],"a":1,"why":"'I sent' — əvəzlik tamamlıqdır, buraxıla bilər."}]},{"t":"Dolayı nitq — Reported Speech","lv":"B2","s":[["p","Başqasının sözünü çatdırmaq üçün. Zaman bir pillə geri çəkilir."],["h","Zaman dəyişməsi"],["f","present → past:  works → worked"],["f","past → past perfect:  worked → had worked"],["f","will → would   ·   can → could   ·   must → had to"],["e","He said: 'I am busy.' ~ He said he was busy."],["e","She said: 'I will send it.' ~ She said she would send it."],["h","Digər dəyişikliklər"],["f","today → that day   ·   tomorrow → the next day"],["f","yesterday → the day before   ·   now → then"],["f","this → that   ·   here → there"],["h","Sualların çatdırılması"],["p","Söz sırası NORMAL olur, köməkçi fel qalxmır."],["e","He asked: 'Where is the file?' ~ He asked where the file was."],["e","She asked: 'Did you send it?' ~ She asked if I had sent it."],["h","say və tell"],["f","say + söz:  He said that..."],["f","tell + kimə + söz:  He told me that..."],["x","He said me that... ~ He told me that..."],["x","He asked where is the server. ~ He asked where the server was."],["w","Bəli/xeyr sualı çatdırılanda 'if' və ya 'whether' işlənir."]],"q":[{"q":"He said: 'I am ready.' Dolayı forma:","o":["He said he is ready.","He said he was ready.","He said he were ready."],"a":1,"why":"Present → Past keçir."},{"q":"Hansı düzdür?","o":["He said me the news.","He told me the news.","He told to me the news."],"a":1,"why":"'tell' birbaşa şəxs alır, 'say' almır."},{"q":"She asked: 'Did you finish?'","o":["She asked did I finish.","She asked if I had finished.","She asked if did I finish."],"a":1,"why":"Bəli/xeyr sualı 'if' ilə, söz sırası normal."}]},{"t":"Modal perfect — should have, must have","lv":"B2","s":[["p","Keçmiş haqqında fikir, t rəm","I started because ... ~ ...-a görə başladım","The hardest part was ... ~ Ən çətin hissə ... idi","What helped me most was ... ~ Ən çox kömək edən ... oldu","I still struggle with ... ~ Hələ də ... ilə çətinlik çəkirəm"]},{"t":"Uzaqdan iş — arqumentlər","lv":"B2","d":"Uzaqdan işin lehinə və əleyhinə arqumentlər gətir, sonra öz mövqeyini bildir.","p":["There are strong arguments on both sides. ~ Hər iki tərəfdə güclü arqumentlər var","Those in favour argue that ... ~ Tərəfdarlar deyir ki, ...","However, critics point out that ... ~ Lakin tənqidçilər qeyd edir ki, ...","Personally, I lean towards ... ~ Şəxsən mən ...-a meylliyəm","That said, it depends largely on ... ~ Bununla belə, bu, əsasən ...-dan asılıdır"]},{"t":"Layihəni təqdim et","lv":"B2","d":"İşlədiyin bir layihəni təqdim et: məqsəd, addımlar, nəticə. Struktur vacibdir.","p":["The aim of the project was to ... ~ Layihənin məqsədi ... idi","We approached it in three stages. ~ Buna üç mərhələdə yanaşdıq","The first stage involved ... ~ Birinci mərhələ ...-i əhatə edirdi","One challenge we faced was ... ~ Qarşılaşdığımız çətinlik ... idi","As a result, we reduced ... by ... percent. ~ Nəticədə ...-i ... faiz azaltdıq","Going forward, the next step is ... ~ Bundan sonra növbəti addım ...-dır"]},{"t":"Fikrini müdafiə et","lv":"B2","d":"Mübahisəli mövzuda mövqe seç və üç arqumentlə əsaslandır.","p":["I firmly believe that ... ~ Möhkəm inanıram ki, ...","There are three reasons for this. ~ Bunun üç səbəbi var","First and foremost, ... ~ Ən əsası, ...","Secondly, ... ~ İkincisi, ...","Finally, and perhaps most importantly, ... ~ Nəhayət, bəlkə də ən vacibi, ...","For these reasons, I would argue that ... ~ Bu səbəblərdən deyərdim ki, ..."]},{"t":"Səhvdən öyrənmək","lv":"B2","d":"Etdiyin bir səhvi və ondan nə öyrəndiyini danış. Modal perfect məşq et.","p":["Looking back, I should have ... ~ Geriyə baxanda ... etməli idim","At the time it seemed like ... ~ O vaxt elə görünürdü ki, ...","If I had known ..., I would have ... ~ ...-i bilsəydim, ... edərdim","The lesson I took from it was ... ~ Ondan çıxardığım dərs ... oldu","Since then, I always ... ~ O vaxtdan həmişə ... edirəm"]},{"t":"Texnologiyanın təsiri","lv":"B2","d":"Bir texnologiyanın sənin sahənə təsirini təhlil et.","p":["Over the past few years, ... has transformed ... ~ Son bir neçə ildə ... ...-i dəyişdi","The most significant impact has been on ... ~ Ən böyük təsir ...-a olub","On the positive side, ... ~ Müsbət tərəfdən, ...","At the same time, it raises concerns about ... ~ Eyni zamanda, ... barədə narahatlıq yaradır","It remains to be seen whether ... ~ ... olub-olmayacağı hələ məlum deyil"]}];
const DIALOGS = [{"t":"Səhər salamlaşma","lv":"A1","d":"Ofisdə həmkarla qısa söhbət","l":[["A","Good morning, Samir.","Sabahın xeyir, Samir."],["B","Morning, Leyla. How are you?","Sabahın xeyir, Leyla. Necəsən?"],["A","Not bad, thanks. A bit tired.","Pis deyil, sağ ol. Bir az yorğunam."],["B","Long night?","Gecə uzun oldu?"],["A","Yes, I was fixing the printer until ten.","Bəli, saat ona qədər printeri düzəldirdim."],["B","Did you manage to fix it?","Düzəltməyi bacardın?"],["A","In the end, yes.","Sonda, bəli."],["B","Well done. Coffee?","Afərin. Qəhvə?"],["A","That would be great, thanks.","Əla olardı, sağ ol."]]},{"t":"Kafedə sifariş","lv":"A1","d":"Sadə sifariş vermək","l":[["A","Hello, what can I get you?","Salam, nə istəyirsiniz?"],["B","Hi. Could I have a black coffee, please?","Salam. Bir qara qəhvə ola bilər?"],["A","Small or large?","Kiçik yoxsa böyük?"],["B","Large, please. And do you have any sandwiches?","Böyük, zəhmət olmasa. Sendviçiniz var?"],["A","We have chicken and cheese.","Toyuqlu və pendirli var."],["B","I will take the chicken one.","Toyuqlusunu götürərəm."],["A","To eat in or take away?","Burada yeyəcəksiniz, yoxsa özünüzlə?"],["B","Take away, please. How much is it?","Özümlə, zəhmət olmasa. Neçəyədir?"],["A","That is eight manats fifty.","Səkkiz manat əlli qəpik."],["B","Here you are. Thank you.","Buyurun. Təşəkkür edirəm."]]},{"t":"Yol soruşmaq","lv":"A1","d":"Küçədə istiqamət soruşmaq","l":[["A","Excuse me, do you speak English?","Bağışlayın, ingiliscə danışırsınız?"],["B","A little, yes.","Bir az, bəli."],["A","I am looking for the metro station.","Metro stansiyasını axtarıram."],["B","Go straight ahead and turn left at the traffic light.","Düz gedin və svetoforda sola dönün."],["A","Is it far?","Uzaqdır?"],["B","No, about five minutes on foot.","Xeyr, piyada təxminən beş dəqiqə."],["A","And which line goes to the airport?","Hansı xətt hava limanına gedir?"],["B","You need to change at the central station.","Mərkəzi stansiyada dəyişməlisiniz."],["A","Thank you very much.","Çox sağ olun."],["B","You are welcome. Have a good day.","Dəyməz. Gününüz xeyir."]]},{"t":"Mağazada alış-veriş","lv":"A1","d":"Ölçü və qiymət soruşmaq","l":[["A","Can I help you?","Kömək edə bilərəm?"],["B","Yes, I am looking for a white shirt.","Bəli, ağ köynək axtarıram."],["A","What size do you need?","Hansı ölçü lazımdır?"],["B","Medium, I think. Can I try it on?","Orta, deyəsən. Geyib baxa bilərəm?"],["A","Of course. The fitting room is over there.","Əlbəttə. Geyinmə otağı oradadır."],["B","It is a bit tight. Do you have a larger one?","Bir az dardır. Daha böyüyü var?"],["A","Let me check. Yes, here you are.","Yoxlayım. Bəli, buyurun."],["B","This one fits. How much is it?","Bu yaxşı oturur. Neçəyədir?"],["A","Forty-five manats. Cash or card?","Qırx beş manat. Nağd, yoxsa kart?"],["B","Card, please.","Kart, zəhmət olmasa."]]},{"t":"Telefon zəngi","lv":"A2","d":"İş zəngini qəbul etmək","l":[["A","Good afternoon, IT department, Samir speaking.","Günortanız xeyir, İT şöbəsi, Samir danışır."],["B","Hi Samir, this is Nigar from accounting.","Salam Samir, mühasibatlıqdan Nigardır."],["A","Hi Nigar, how can I help?","Salam Nigar, necə kömək edə bilərəm?"],["B","I cannot log into the system this morning.","Bu səhər sistemə girə bilmirəm."],["A","What error message do you get?","Hansı xəta mesajı çıxır?"],["B","It says the account is locked.","Hesabın kilidləndiyini yazır."],["A","I see. Let me unlock it for you.","Anladım. İcazə verin kilidini açım."],["B","How long will it take?","Nə qədər çəkəcək?"],["A","Just a moment. Try again now.","Bir dəqiqə. İndi bir də cəhd edin."],["B","It works. Thank you so much.","İşləyir. Çox sağ olun."],["A","No problem. Let me know if it happens again.","Problem yoxdur. Təkrarlansa, mənə deyin."]]},{"t":"Hava limanında qeydiyyat","lv":"A2","d":"Uçuşa qeydiyyat və baqaj","l":[["A","Good evening. Your passport, please.","Axşamınız xeyir. Pasportunuz, zəhmət olmasa."],["B","Here it is.","Buyurun."],["A","Are you checking in any luggage?","Baqaj təhvil verirsiniz?"],["B","Just one suitcase.","Yalnız bir çamadan."],["A","Please put it on the belt. It is twenty-three kilos.","Xahiş edirəm lentə qoyun. İyirmi üç kiloqramdır."],["B","Is that within the limit?","Bu limitə uyğundur?"],["A","Yes, the limit is twenty-five.","Bəli, limit iyirmi beşdir."],["B","Which gate is it?","Hansı qapıdır?"],["A","Gate twelve. Boarding starts at nine forty.","On ikinci qapı. Miniş doqquz qırxda başlayır."],["B","And is the flight on time?","Uçuş vaxtındadır?"],["A","So far, yes. Have a pleasant flight.","Hələlik bəli. Xoş uçuşlar."]]},{"t":"Otelə yerləşmə","lv":"A2","d":"Rezervasiya və otaq məsələləri","l":[["A","Good evening. Do you have a reservation?","Axşamınız xeyir. Rezervasiyanız var?"],["B","Yes, under the name Aliyev.","Bəli, Əliyev adına."],["A","Let me check. A single room for three nights?","Yoxlayım. Üç gecəyə tək otaq?"],["B","That is right.","Düzdür."],["A","Could I have your passport, please?","Pasportunuzu ala bilərəm?"],["B","Here you are. Is breakfast included?","Buyurun. Səhər yeməyi daxildir?"],["A","Yes, from seven to ten in the restaurant.","Bəli, restoranda yeddidən ona qədər."],["B","What is the wifi password?","Wifi şifrəsi nədir?"],["A","It is written on your key card.","Otaq kartınızın üstündə yazılıb."],["B","Great. What time is check out?","Əla. Çıxış saatı neçədir?"],["A","Eleven o'clock. Enjoy your stay.","Saat on birdə. Xoş qalın."]]},{"t":"Yeni həmkarla tanışlıq","lv":"A2","d":"Özünü təqdim etmək","l":[["A","Hi, you must be the new engineer.","Salam, siz yəqin yeni mühəndissiniz."],["B","Yes, I am Rashad. Nice to meet you.","Bəli, mən Rəşadam. Tanış olmağıma şadam."],["A","Nice to meet you too. I am Samir, head of IT.","Mən də şadam. Mən Samir, İT rəhbəri."],["B","Great to meet you. I started on Monday.","Çox şadam. Bazar ertəsi başlamışam."],["A","How are you settling in?","Uyğunlaşırsınız?"],["B","Well, thanks. Everyone has been very helpful.","Yaxşı, sağ olun. Hamı çox kömək edir."],["A","What did you do before this?","Bundan əvvəl nə işlə məşğul idiniz?"],["B","I worked at a telecom company for four years.","Dörd il telekom şirkətində işləmişəm."],["A","That experience will be useful here.","O təcrübə burada faydalı olacaq."],["B","I hope so. Who should I talk to about access rights?","Ümid edirəm. Giriş hüquqları barədə kimlə danışım?"],["A","Talk to me. I will set it up today.","Mənimlə. Bu gün quraram."]]},{"t":"Həkimə müraciət","lv":"A2","d":"Şikayəti izah etmək","l":[["A","Good morning. What seems to be the problem?","Sabahınız xeyir. Nə problem var?"],["B","I have had a headache for three days.","Üç gündür başım ağrıyır."],["A","Is it constant or does it come and go?","Daimidir, yoxsa gəlib-gedir?"],["B","It comes and goes, mostly in the evening.","Gəlib-gedir, əsasən axşamlar."],["A","Are you sleeping well?","Yaxşı yatırsınız?"],["B","Not really. About five hours a night.","Elə də yox. Gecədə təxminən beş saat."],["A","Do you spend a lot of time at a screen?","Ekran qarşısında çox vaxt keçirirsiniz?"],["B","Yes, around ten hours a day.","Bəli, gündə təxminən on saat."],["A","That is likely the cause. Take regular breaks.","Yəqin səbəb budur. Müntəzəm fasilə verin."],["B","Should I take anything for the pain?","Ağrı üçün nəsə qəbul edim?"],["A","Only if it is severe. Come back in a week.","Yalnız şiddətli olsa. Bir həftədən sonra gəlin."]]},{"t":"İclası planlaşdırmaq","lv":"B1","d":"Vaxt razılaşdırmaq","l":[["A","Are you free sometime this week?","Bu həftə vaxtınız olacaq?"],["B","Let me check my calendar. What is it about?","Təqvimimə baxım. Nə barədədir?"],["A","I would like to go through the migration plan.","Miqrasiya planını nəzərdən keçirmək istərdim."],["B","How long do you need?","Nə qədər vaxt lazımdır?"],["A","About forty minutes should be enough.","Təxminən qırx dəqiqə kifayət edər."],["B","Tuesday at eleven works for me.","Çərşənbə axşamı saat on bir mənə uyğundur."],["A","Perfect. Shall I send an invite?","Əla. Dəvət göndərim?"],["B","Yes, please. And could you share the plan beforehand?","Bəli, zəhmət olmasa. Planı əvvəlcədən göndərə bilərsiniz?"],["A","Of course. I will send it today.","Əlbəttə. Bu gün göndərəcəyəm."],["B","Great. Should we invite the vendor as well?","Əla. Təchizatçını da dəvət edək?"],["A","Good point. I will loop them in.","Yaxşı fikir. Onları da əlavə edərəm."]]},{"t":"Texniki dəstək zəngi","lv":"B1","d":"Problemi izah və həll etmək","l":[["A","Support desk, how can I help?","Dəstək xidməti, necə kömək edə bilərəm?"],["B","Our internet banking site is returning an error.","İnternet bankçılıq saytımız xəta qaytarır."],["A","Could you tell me the exact error code?","Dəqiq xəta kodunu deyə bilərsiniz?"],["B","It shows five twenty-five.","Beş yüz iyirmi beş göstərir."],["A","That usually points to a certificate issue.","Bu adətən sertifikat problemini göstərir."],["B","We renewed the certificate last month.","Sertifikatı keçən ay yeniləmişik."],["A","Was it installed on the load balancer as well?","Yük balanslaşdırıcıda da quraşdırıldı?"],["B","I am not sure. Let me check.","Əmin deyiləm. Yoxlayım."],["A","Take your time.","Tələsməyin."],["B","You were right. The old one is still there.","Haqlı idiniz. Köhnəsi hələ də oradadır."],["A","Replace it and restart the service.","Onu dəyişin və xidməti yenidən başladın."],["B","It is working now. Thanks for your help.","İndi işləyir. Kömək üçün təşəkkür."]]},{"t":"Layihə statusu görüşü","lv":"B1","d":"İrəliləyiş hesabatı vermək","l":[["A","Let us start with the status update.","Status yeniləməsi ilə başlayaq."],["B","Sure. We completed the first two modules.","Əlbəttə. İlk iki modulu tamamladıq."],["A","Are we still on schedule?","Cədvələ uyğun gedirik?"],["B","More or less. We are two days behind.","Az-çox. İki gün geridəyik."],["A","What caused the delay?","Gecikməyə nə səbəb oldu?"],["B","We ran into an issue with the API integration.","API inteqrasiyası ilə problem yaşadıq."],["A","Has it been resolved?","Həll olundu?"],["B","Yes, it turned out to be a header name.","Bəli, məlum oldu ki, başlıq adı imiş."],["A","Good. Can we make up the two days?","Yaxşı. İki günü bərpa edə bilərik?"],["B","I believe so, if nothing else comes up.","Düşünürəm ki, bəli, başqa problem çıxmasa."],["A","Keep me posted. Anything you need from me?","Xəbərdar edin. Məndən nəsə lazımdır?"],["B","Just approval for the extra test environment.","Yalnız əlavə test mühiti üçün təsdiq."]]},{"t":"Şikayəti həll etmək","lv":"B1","d":"Narazı müştəri ilə danışmaq","l":[["A","I have been waiting three days for a reply.","Üç gündür cavab gözləyirəm."],["B","I am very sorry about that. Let me look into it.","Buna görə çox üzr istəyirəm. Araşdırım."],["A","This is the second time this month.","Bu ay ikinci dəfədir."],["B","I understand your frustration.","Narazılığınızı başa düşürəm."],["A","I just want to know when it will be fixed.","Sadəcə nə vaxt düzələcəyini bilmək istəyirəm."],["B","I can see your ticket here. It was not escalated.","Müraciətinizi görürəm. Yuxarı qaldırılmayıb."],["A","So it was sitting there for three days?","Yəni üç gün orada qalıb?"],["B","Unfortunately, yes. That should not have happened.","Təəssüf ki, bəli. Bu baş verməməli idi."],["A","What are you going to do about it?","Bu barədə nə edəcəksiniz?"],["B","I am taking it personally and will call you by five.","Şəxsən öz üzərimə götürürəm və beşə qədər zəng edəcəyəm."],["A","I appreciate that.","Bunu qiymətləndirirəm."],["B","Again, I apologise for the delay.","Bir daha gecikməyə görə üzr istəyirəm."]]},{"t":"Vendorla qiymət danışığı","lv":"B2","d":"Şərtləri müzakirə etmək","l":[["A","Thank you for the quotation. I have a few questions.","Qiymət təklifi üçün təşəkkür. Bir neçə sualım var."],["B","Of course, go ahead.","Əlbəttə, buyurun."],["A","The licence cost is higher than we expected.","Lisenziya xərci gözlədiyimizdən yüksəkdir."],["B","It reflects the number of users you requested.","Bu, tələb etdiyiniz istifadəçi sayını əks etdirir."],["A","We could start with fewer seats.","Daha az yerlə başlaya bilərik."],["B","That is possible. How many did you have in mind?","Bu mümkündür. Neçəsini nəzərdə tutursunuz?"],["A","Around sixty for the first year.","İlk il üçün təxminən altmış."],["B","I can offer a fifteen percent discount at that volume.","Bu həcmdə on beş faiz endirim təklif edə bilərəm."],["A","What about support? Is it included?","Dəstək necə? Daxildir?"],["B","Standard support is included. Premium is extra.","Standart dəstək daxildir. Premium əlavədir."],["A","Could you send a revised proposal by Friday?","Cüməyə qədər yenilənmiş təklif göndərə bilərsiniz?"],["B","Certainly. You will have it by Thursday.","Əlbəttə. Cümə axşamına qədər sizdə olacaq."]]},{"t":"İş müsahibəsi","lv":"B2","d":"Təcrübə və bacarıqlardan danışmaq","l":[["A","Thanks for coming in. Tell me about yourself.","Gəldiyiniz üçün təşəkkür. Özünüz haqqında danışın."],["B","I have been working in banking IT for ten years.","On ildir bank İT sahəsində işləyirəm."],["A","What are you responsible for at the moment?","Hazırda nəyə görə məsulsunuz?"],["B","I manage the whole infrastructure and security.","Bütün infrastruktur və təhlükəsizliyi idarə edirəm."],["A","That is a broad role. Do you have a team?","Geniş vəzifədir. Komandanız var?"],["B","A small one. Most of the work I do myself.","Kiçik. İşin çoxunu özüm görürəm."],["A","What would you say is your biggest achievement?","Ən böyük nailiyyətiniz nədir?"],["B","I built our internal platform from scratch.","Daxili platformamızı sıfırdan qurdum."],["A","And your biggest challenge?","Ən böyük çətinliyiniz?"],["B","Balancing regulatory deadlines with daily support.","Tənzimləyici son tarixləri gündəlik dəstəklə balanslaşdırmaq."],["A","Where do you see yourself in five years?","Beş ildən sonra özünüzü harada görürsünüz?"],["B","Leading a larger infrastructure team.","Daha böyük infrastruktur komandasına rəhbərlik edərkən."],["A","Do you have any questions for us?","Bizə sualınız var?"],["B","Yes, how is the team structured?","Bəli, komanda necə qurulub?"]]},{"t":"Kəsintini idarə etmək","lv":"B2","d":"Böhran anında ünsiyyət","l":[["A","We have a production outage. Users cannot log in.","İstehsalatda kəsinti var. İstifadəçilər girə bilmir."],["B","Since when?","Nə vaxtdan?"],["A","It started about fifteen minutes ago.","Təxminən on beş dəqiqə əvvəl başladı."],["B","Have we identified the root cause?","Əsas səbəbi müəyyən etmisiniz?"],["A","Not yet. The database is responding normally.","Hələ yox. Verilənlər bazası normal cavab verir."],["B","What about the authentication service?","Autentifikasiya xidməti necə?"],["A","That is what we are checking now.","Elə indi onu yoxlayırıq."],["B","Keep the business informed every fifteen minutes.","Hər on beş dəqiqədən bir biznesi məlumatlandırın."],["A","Understood. Should we roll back last night's change?","Anlaşıldı. Dünən gecəki dəyişikliyi geri qaytaraq?"],["B","If we find nothing in ten minutes, yes.","On dəqiqədə heç nə tapmasaq, bəli."],["A","Agreed. I will report back shortly.","Razıyam. Tezliklə məlumat verəcəyəm."],["B","Thank you. Stay calm and document everything.","Sağ olun. Sakit olun və hər şeyi qeyd edin."]]}];
const SHADOW = [{"t":"Səsli mesaj qoymaq","lv":"A2","d":"Telefon açılmayanda mesaj buraxmaq","l":[["Hi, this is Samir calling from Bank Melli. I am trying to reach Ilyas about the API integration.","Salam, Bank Melli-dən Samir zəng edir. İlyası API inteqrasiyası barədə axtarıram."],["I sent you an email on Monday, but I have not heard back, so I thought I would give you a call.","Bazar ertəsi e-poçt göndərdim, amma cavab almadım, ona görə zəng etmək istədim."],["The short version is that we are still getting an authentication error on the test gateway.","Qısası, test şlüzündə hələ də autentifikasiya xətası alırıq."],["If you could send over the correct header name, I think we could close this off in about ten minutes.","Düzgün başlıq adını göndərsəniz, məncə bunu on dəqiqəyə bağlaya bilərik."],["You can reach me on this number any time before six, or just reply to my email if that is easier.","Altıya qədər bu nömrədən mənə çata bilərsiniz, ya da asandırsa e-poçtuma cavab yazın."],["Thanks a lot, and I look forward to hearing from you. Bye for now.","Çox sağ olun, cavabınızı gözləyirəm. Hələlik."]]},{"t":"İclasda status hesabatı","lv":"B1","d":"Həftəlik görüşdə vəziyyəti danışmaq","l":[["Right, let me give you a quick update on where we are with the migration project.","Yaxşı, miqrasiya layihəsində harada olduğumuz barədə qısa məlumat verim."],["We finished the first two modules last week, and both of them passed testing without any major issues.","Keçən həftə ilk iki modulu bitirdik və hər ikisi ciddi problem olmadan testdən keçdi."],["The third module is about eighty percent complete, but we have run into a small problem with the reporting layer.","Üçüncü modul təxminən səksən faiz hazırdır, amma hesabat qatında kiçik problemlə üzləşdik."],["Nothing serious, it just means we are running roughly two days behind the original schedule.","Ciddi bir şey deyil, sadəcə ilkin cədvəldən təxminən iki gün geridəyik."],["If nothing else comes up, I am confident we can make that time back before the end of the month.","Başqa problem çıxmasa, ayın sonuna qədər bu vaxtı bərpa edə biləcəyimizə əminəm."],["The only thing I need from you is sign-off on the extra test environment, ideally by Wednesday.","Sizdən yalnız əlavə test mühiti üçün təsdiq lazımdır, ideal halda çərşənbəyə qədər."],["Other than that, everything is on track. Happy to take any questions.","Bundan başqa hər şey qaydasındadır. Suallarınıza cavab verməyə hazıram."]]},{"t":"İnsident brifinqi","lv":"B2","d":"Kəsintidən sonra rəhbərliyə hesabat","l":[["I want to walk you through what happened yesterday evening and what we have done since then.","Dünən axşam nə baş verdiyini və o vaxtdan bəri nə etdiyimizi izah etmək istəyirəm."],["At around seven o'clock, users started reporting that they could not log into internet banking.","Saat yeddi radələrində istifadəçilər internet bankçılığa girə bilmədiklərini bildirməyə başladılar."],["Our first assumption was a database problem, but the database was responding perfectly normally.","İlk fərziyyəmiz verilənlər bazası problemi idi, amma baza tamamilə normal cavab verirdi."],["It turned out that the certificate on the load balancer had expired, and the renewal had only been applied to one of the two nodes.","Məlum oldu ki, yük balanslaşdırıcıdakı sertifikatın müddəti bitib və yeniləmə iki qovşaqdan yalnız birinə tətbiq olunub."],["We replaced it and restarted the service, and everything came back up within about forty minutes.","Onu dəyişdik və xidməti yenidən başlatdıq, hər şey təxminən qırx dəqiqəyə bərpa oldu."],["The total impact was around ninety minutes of degraded service for roughly two thousand customers.","Ümumi təsir təxminən iki min müştəri üçün doxsan dəqiqəlik pozulmuş xidmət oldu."],["To stop this happening again, we have set up automated monitoring on every certificate we own.","Bunun təkrarlanmaması üçün sahib olduğumuz hər sertifikata avtomatik monitorinq qurmuşuq."],["It now alerts us thirty days before expiry, and it checks both nodes rather than just the primary one.","İndi bitməsinə otuz gün qalmış xəbərdarlıq edir və yalnız əsas deyil, hər iki qovşağı yoxlayır."]]},{"t":"Müştəriyə problemi izah etmək","lv":"B1","d":"Texniki məsələni sadə dillə çatdırmaq","l":[["Thank you for holding, and I am sorry about the wait. Let me explain what is going on.","Gözlədiyiniz üçün təşəkkür və gecikməyə görə üzr istəyirəm. İcazə verin nə baş verdiyini izah edim."],["The problem you are seeing is not with your account, so there is nothing wrong on your side at all.","Gördüyünüz problem hesabınızla bağlı deyil, sizin tərəfinizdə heç bir nasazlıq yoxdur."],["What has happened is that one of our servers is running slowly, and that is delaying some transactions.","Baş verən odur ki, serverlərimizdən biri yavaş işləyir və bu, bəzi əməliyyatları gecikdirir."],["Your money is completely safe, and every transaction you made today has been recorded correctly.","Pulunuz tamamilə təhlükəsizdir və bu gün etdiyiniz hər əməliyyat düzgün qeydə alınıb."],["Our engineers are working on it right now, and we expect everything to be back to normal within the hour.","Mühəndislərimiz elə indi bunun üzərində işləyir, bir saat ərzində hər şeyin normala qayıtmasını gözləyirik."],["If you would like, I can take your number and call you personally as soon as it is resolved.","İstəsəniz, nömrənizi götürüb həll olunan kimi şəxsən sizə zəng edə bilərəm."],["Again, I really do apologise for the inconvenience, and thank you for being so patient with us.","Bir daha narahatlığa görə səmimi üzr istəyirəm və səbrinizə görə təşəkkür edirəm."]]},{"t":"Müsahibə: özünüz haqqında","lv":"B2","d":"Ən çox verilən suala hazır cavab","l":[["Of course. I have been working in banking technology for just over ten years now.","Əlbəttə. On ildən çoxdur ki, bank texnologiyaları sahəsində işləyirəm."],["I started out in support, moved into networking after a couple of years, and now I run the whole IT function.","Dəstək xidmətindən başladım, bir neçə ildən sonra şəbəkəyə keçdim, indi isə bütün İT funksiyasına rəhbərlik edirəm."],["In my current role I am responsible for infrastructure, information security, and regulatory reporting.","Hazırkı vəzifəmdə infrastruktur, informasiya təhlükəsizliyi və tənzimləyici hesabatlara görə məsulam."],["It is quite a broad role, mainly because we are a small branch, so I tend to do a bit of everything.","Kifayət qədər geniş vəzifədir, əsasən ona görə ki, kiçik filialıq, ona görə hər işdən bir az görürəm."],["The part I enjoy most is building things, and the platform we use internally is something I designed from scratch.","Ən çox zövq aldığım hissə bir şey qurmaqdır, daxildə istifadə etdiyimiz platformanı sıfırdan özüm dizayn etmişəm."],["What I am looking for now is a role where I can go deeper on the infrastructure side and work with a larger team.","İndi axtardığım infrastruktur tərəfində daha dərinə getmək və daha böyük komanda ilə işləmək imkanıdır."],["That is really why this position caught my eye, and I would be glad to go into any part of it in more detail.","Bu vəzifənin diqqətimi çəkməsinin əsl səbəbi budur, istənilən hissəsini daha ətraflı danışmağa şadam."]]},{"t":"Təqdimatın açılışı","lv":"B2","d":"Auditoriya qarşısında başlamaq","l":[["Good morning, everyone, and thank you all for making the time to be here today.","Sabahınız xeyir hamıya, bu gün burada olmaq üçün vaxt ayırdığınıza görə təşəkkür."],["For those who do not know me, my name is Samir and I head up the IT department at the Baku branch.","Məni tanımayanlar üçün deyim, adım Samirdir və Bakı filialında İT şöbəsinə rəhbərlik edirəm."],["Over the next twenty minutes I want to cover three things, and then leave plenty of room for questions.","Növbəti iyirmi dəqiqədə üç məsələni əhatə etmək və sonra suallar üçün kifayət qədər vaxt saxlamaq istəyirəm."],["First, where we are today. Second, the main risks I think we are carrying. And third, what I would suggest we do about them.","Birincisi, bu gün harada olduğumuz. İkincisi, daşıdığımızı düşündüyüm əsas risklər. Üçüncüsü isə bu barədə nə etməyi təklif etdiyim."],["I will try to keep the technical detail to a minimum, but do stop me at any point if something is not clear.","Texniki detalları minimumda saxlamağa çalışacağam, amma nəsə aydın olmasa istənilən anda məni saxlayın."],["So, let us start with a quick look at where things stand right now.","Beləliklə, hazırkı vəziyyətə qısa nəzər salmaqla başlayaq."]]},{"t":"Yeni işçiyə sistemi izah etmək","lv":"B1","d":"Addım-addım prosesi çatdırmaq","l":[["Right, let me show you how the system works, and then you can have a go yourself.","Yaxşı, sistemin necə işlədiyini göstərim, sonra özünüz sınayarsınız."],["The first thing you need to do every morning is log in and check whether the overnight jobs completed.","Hər səhər ilk etməli olduğunuz şey giriş etmək və gecə işlərinin tamamlandığını yoxlamaqdır."],["If any of them failed, you will see a red flag next to the job name, and the details are in the log below.","Onlardan biri uğursuz olsa, iş adının yanında qırmızı bayraq görəcəksiniz, təfərrüatlar isə aşağıdakı jurnaldadır."],["Nine times out of ten it is just a network timeout, so you can simply run it again and it will go through.","On haldan doqquzunda bu sadəcə şəbəkə vaxt aşımıdır, yenidən işə salsanız keçəcək."],["If it fails a second time, do not keep retrying. Take a screenshot and send it to me straight away.","İkinci dəfə də uğursuz olsa, təkrar cəhd etməyin. Ekran şəkli çəkin və dərhal mənə göndərin."],["The most important rule is that you never change anything in production without telling someone first.","Ən vacib qayda budur ki, kiməsə demədən istehsalat mühitində heç nəyi dəyişməyin."],["Other than that, feel free to click around and explore. You cannot break anything from this screen.","Bundan başqa, rahat kliklə və araşdır. Bu ekrandan heç nəyi sındıra bilməzsən."]]},{"t":"Vendorla telefon danışığı","lv":"B2","d":"Şərtləri müzakirə etmək","l":[["Hi Michael, thanks for taking the call. I have had a chance to look through the proposal you sent.","Salam Michael, zəngi qəbul etdiyiniz üçün təşəkkür. Göndərdiyiniz təklifə baxmaq imkanım oldu."],["Overall it looks solid, and the technical side is more or less exactly what we were hoping for.","Ümumilikdə möhkəm görünür, texniki tərəf az-çox tam gözlədiyimiz kimidir."],["Where I am struggling a little is the pricing, particularly the licence cost for the first year.","Bir az çətinlik çəkdiyim yer qiymətdir, xüsusən də ilk il üçün lisenziya xərci."],["The figure you quoted is roughly thirty percent above what we have set aside in this year's budget.","Göstərdiyiniz rəqəm bu ilki büdcəmizdə ayırdığımızdan təxminən otuz faiz yuxarıdır."],["I am not asking you to cut your margin. I am wondering whether we could start with fewer user seats.","Sizdən marjanızı azaltmağı xahiş etmirəm. Daha az istifadəçi yeri ilə başlaya bilərikmi deyə düşünürəm."],["If we began with sixty and added more as we roll out, would that work from your side?","Altmışla başlayıb tətbiq etdikcə artırsaq, sizin tərəfdən bu uyğun olar?"],["If you could put a revised version together by Friday, I can take it to the board next week.","Cüməyə qədər yenilənmiş variant hazırlaya bilsəniz, gələn həftə idarə heyətinə təqdim edərəm."]]},{"t":"Həftəsonundan danışmaq","lv":"A2","d":"Gündəlik söhbət — ən çox lazım olan","l":[["It was pretty quiet, actually. I did not have any big plans, which was honestly a relief.","Əslində olduqca sakit keçdi. Böyük planım yox idi, düzü bu rahatlıq idi."],["On Saturday morning I slept in for once, and then I spent a couple of hours working on the flat.","Şənbə səhəri bir dəfəlik gec yatdım, sonra bir neçə saat mənzillə məşğul oldum."],["I have been meaning to finish painting the kitchen for about three months, so I finally made a start.","Təxminən üç aydır mətbəxi rəngləməyi bitirmək istəyirdim, nəhayət başladım."],["In the afternoon we drove out of the city and had lunch at a place near the coast.","Günortadan sonra şəhərdən çıxdıq və sahilə yaxın bir yerdə nahar etdik."],["Sunday was mostly family. My parents came over, we had a long lunch, and I did not touch the laptop once.","Bazar günü əsasən ailə ilə keçdi. Valideynlərim gəldi, uzun nahar etdik və noutbuka bir dəfə də toxunmadım."],["So nothing exciting, but that is exactly what I needed. How about you, did you get up to much?","Yəni maraqlı bir şey yox, amma mənə elə bu lazım idi. Bəs sən, nəsə etdin?"]]},{"t":"Səyahət təcrübəsi","lv":"B1","d":"Hekayə danışmaq — keçmiş zaman məşqi","l":[["The trip I always end up talking about is the one I took to Istanbul a few years ago.","Həmişə danışdığım səfər bir neçə il əvvəl İstanbula etdiyim səfərdir."],["I only went for four days, mainly for a conference, but I managed to see quite a lot in that time.","Cəmi dörd gün getmişdim, əsasən konfrans üçün, amma o müddətdə xeyli şey görməyi bacardım."],["What surprised me most was how walkable the old part of the city is once you get away from the main roads.","Məni ən çox təəccübləndirən əsas yollardan uzaqlaşanda şəhərin köhnə hissəsinin nə qədər piyada gəzilə bilən olması idi."],["On the second evening I got completely lost, and I ended up in a small street full of tiny restaurants.","İkinci axşam tamam yolumu itirdim və kiçik restoranlarla dolu balaca bir küçəyə düşdüm."],["I had the best meal of the whole trip there, and I still could not tell you the name of the place.","Bütün səfərin ən yaxşı yeməyini orada yedim və hələ də o yerin adını deyə bilmərəm."],["If I went back tomorrow, I would stay longer and spend far less time in conference rooms.","Sabah qayıtsaydım, daha uzun qalar və konfrans zallarında xeyli az vaxt keçirərdim."]]},{"t":"Fikri müdafiə etmək","lv":"B2","d":"Arqument qurmaq və mövqe tutmaq","l":[["I know this is not a popular view in the room, but I think we are approaching the problem from the wrong end.","Bilirəm ki, bu, otaqda populyar fikir deyil, amma məncə problemə səhv tərəfdən yanaşırıq."],["Everyone is focused on buying a new tool, when the real issue is that nobody owns the process.","Hamı yeni alət almağa fokuslanıb, halbuki əsl problem odur ki, prosesin sahibi yoxdur."],["We could spend a hundred thousand manats tomorrow and still be having this same conversation next year.","Sabah yüz min manat xərcləyə bilərik və gələn il yenə eyni söhbəti edərik."],["What I would suggest instead is that we start small, fix the process, and only then look at tooling.","Əvəzində təklifim budur ki, kiçikdən başlayaq, prosesi düzəldək və yalnız ondan sonra alətlərə baxaq."],["That gives us something working within a month rather than a project that drags on for a year.","Bu, bir il uzanan layihə əvəzinə bir ay ərzində işləyən bir şey verir."],["I am obviously happy to be persuaded otherwise, but I would want to see the numbers first.","Əlbəttə, əksinə inandırılmağa açığam, amma əvvəlcə rəqəmləri görmək istərdim."]]},{"t":"Xəbəri şərh etmək","lv":"B1","d":"Oxuduğunu təkrar danışmaq","l":[["I read something interesting this morning about how banks are starting to use artificial intelligence.","Bu səhər bankların süni intellektdən istifadəyə necə başladığı barədə maraqlı bir şey oxudum."],["Apparently most of them are not using it for anything customer facing yet, which surprised me a bit.","Görünür, onların əksəriyyəti hələ müştəriyə yönəlik heç nədə istifadə etmir, bu məni bir az təəccübləndirdi."],["The main use so far seems to be internal, things like detecting fraud and speeding up reporting.","İndiyə qədər əsas istifadə daxili görünür — fırıldaqçılığın aşkarlanması və hesabatın sürətləndirilməsi kimi."],["What struck me was the point about small banks, because they simply do not have the data volume.","Məni vuran kiçik banklar barədə fikir oldu, çünki onlarda sadəcə kifayət qədər məlumat həcmi yoxdur."],["So the gap between the large players and everyone else could actually get wider, not narrower.","Yəni böyük oyunçularla qalanlar arasındakı fərq daralmaq əvəzinə genişlənə bilər."],["I am not sure I agree with all of it, but it is definitely worth a read if you get five minutes.","Hər şeyi ilə razı olduğuma əmin deyiləm, amma beş dəqiqəniz olsa oxumağa dəyər."]]},{"t":"Şikayətə cavab vermək","lv":"B2","d":"Gərgin vəziyyəti sakitləşdirmək","l":[["First of all, I want to say that you are completely right to be frustrated, and I am not going to argue with that.","İlk növbədə demək istəyirəm ki, narazı olmaqda tamamilə haqlısınız və mən bununla mübahisə etməyəcəyəm."],["Waiting three days for a reply is not the standard we set for ourselves, and it should not have happened.","Cavab üçün üç gün gözləmək özümüzə qoyduğumuz standart deyil və bu baş verməməli idi."],["I have looked at your ticket, and I can see exactly where it went wrong. It was never escalated.","Müraciətinizə baxdım və harada səhv getdiyini dəqiq görürəm. O, heç vaxt yuxarı qaldırılmayıb."],["That is on us, not on you, and I am not going to try to explain it away as a system problem.","Bu bizim təqsirimizdir, sizin yox və mən bunu sistem problemi kimi izah etməyə çalışmayacağam."],["What I am going to do is take ownership of this personally and stay on it until it is closed.","Edəcəyim şey budur ki, bunu şəxsən öz üzərimə götürəcəyəm və bağlanana qədər izləyəcəyəm."],["You will hear from me before five o'clock today, whether I have a full answer or not.","Tam cavabım olsun ya olmasın, bu gün saat beşə qədər məndən xəbər alacaqsınız."],["And if you are still not happy after that, my direct number is on the email I am about to send you.","Ondan sonra da razı qalmasanız, birbaşa nömrəm indi göndərəcəyim e-poçtdadır."]]},{"t":"Prosesi izah etmək","lv":"B1","d":"Ardıcıllıq bildirən bağlayıcılar","l":[["The process itself is fairly simple once you have done it a couple of times, so do not worry about it.","Bir neçə dəfə etdikdən sonra prosesin özü kifayət qədər sadədir, ona görə narahat olmayın."],["To begin with, you export the raw data from the core system, and you save it as a CSV file.","Əvvəlcə əsas sistemdən xam məlumatı ixrac edirsiniz və CSV faylı kimi saxlayırsınız."],["Once you have done that, you open the reporting template and you run the macro from the ribbon.","Bunu etdikdən sonra hesabat şablonunu açıb lentdən makronu işə salırsınız."],["The macro will ask you to select the file, and after that it does everything else automatically.","Makro sizdən faylı seçməyi xahiş edəcək, ondan sonra qalan hər şeyi avtomatik edir."],["While it is running, do not touch the keyboard, because it will pick up whatever cell you land on.","İşləyərkən klaviaturaya toxunmayın, çünki hansı xanaya düşsəniz onu götürəcək."],["Finally, you check that the totals at the bottom match the control figure, and then you submit it.","Nəhayət, aşağıdakı cəmlərin nəzarət rəqəminə uyğun gəldiyini yoxlayır və təqdim edirsiniz."],["The whole thing takes about ten minutes, and most of that is just waiting for the export to finish.","Bütün bu iş təxminən on dəqiqə çəkir və onun çoxu sadəcə ixracın bitməsini gözləməkdir."]]}];
